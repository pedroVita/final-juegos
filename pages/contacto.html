<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>NG Juegos</title>
</head>

<body>
    <header class="encabezado">

        <div class="titulo">
            <div><img src="../src/logo.png" alt="logo"></div>
            <h4>NG juegos</h4>
        </div>

        <nav class="menu">
            <a href="../pages/galeria.html">galeria</a>
            <a href="../index.html">productos</a>
            <a class="BtnContactos" href="">contactos</a>
        </nav>

    </header>
    <main>

        <div class="mapaformulario">

            <div class="mapa">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3277.6469004402197!2d-58.411935325643356!3d-34.76448656600407!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bcd28ccef8427f%3A0x125101ffe0653eb4!2sInstituto%20Superior%20de%20Formaci%C3%B3n%20T%C3%A9cnica%20N%C2%B0%20172!5e0!3m2!1ses-419!2sar!4v1779460686251!5m2!1ses-419!2sar"
                    width="400" height="400" style="border:0;
                 justify-content: center;
                  align-items: center; 
                  margin-left: 400px; " allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                </iframe>

                <div class="formulario2">
                    <div class="frmNombre">
                        <label for="nombre">nombre:</label>
                        <input type="text" id="nombre" placeholder="nombre" maxlength="10" size="10" name="nombre"
                            required>

                    </div>
                    <br>
                    <br>
                    <div class="frmCorreo">
                        <label for="correo">correo:</label>
                        <input type="email" id="correo" placeholder="correo@gmail.com" size="30" name="correo">
                    </div>

                    <br><br>
                    <div class="frmMensaje">
                        <label for="mensaje">mensaje:</label>
                        <textarea name="mensaje" id="mensaje" placeholder="mensaje"></textarea>
                    </div>

                    <br>
                    <br>
                    <input type="submit" class="btnenviar" value="enviar">
                </div>

            </div>


        </div>



    </main>
    <footer>
        <div class="descripcionGeneral">
            <div class="descripcion">
                <img src="../src/logo.png" alt="">
                <h5>NG juegos</h5>


            </div>
            <div class="descripcion2">
                <h6>juegos de consola y PC</h6>
            </div>
            <div class="copyright">
                <img src="../src/copyright.png" alt="copyright">
                <h6>2026 NG juegos. Todos los derechos reservados</h6>
            </div>
        </div>

        <img src="" alt="">
        <div class="contactos">
            <h5>juegos@gmail.com</h5>
            <h5>11 5555-5555</h5>
            <div class="redes">
                <img src="../src/redes/facebook.png" alt="">
                <img src="../src/redes/insta.png" alt="">
                <img src="../src/redes/twitter.png" class="twitter" alt="">
            </div>
        </div>


    </footer>





</body>

</html>
